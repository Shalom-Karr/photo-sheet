<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Sheet</title>
  <meta name="description" content="Arrange photos into print-ready sheets — automatic layout, multi-page, zoom, and PDF or PNG export, all in the browser. | Built by Shalom Karr">
  <meta name="author" content="Shalom Karr">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:,">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="flex h-screen">
    <aside class="w-72 shrink-0 bg-slate-800 p-4 space-y-4 overflow-y-auto">
      <h1 class="text-lg font-semibold">Photo Sheet</h1>

      <div class="space-y-2">
        <button id="pick" class="w-full rounded bg-sky-600 hover:bg-sky-500 px-3 py-2 text-sm">Add photos…</button>
        <p class="text-xs text-slate-400">or paste with Ctrl+V, or drag files onto the sheet</p>
      </div>

      <div class="flex gap-2">
        <button id="undo" title="Undo (Ctrl+Z)"
          class="flex-1 rounded bg-slate-600 hover:bg-slate-500 disabled:opacity-40 disabled:hover:bg-slate-600 px-3 py-2 text-sm transition">↶ Undo</button>
        <button id="redo" title="Redo (Ctrl+Y)"
          class="flex-1 rounded bg-slate-600 hover:bg-slate-500 disabled:opacity-40 disabled:hover:bg-slate-600 px-3 py-2 text-sm transition">↷ Redo</button>
      </div>

      <div class="space-y-2 border-t border-slate-700 pt-3">
        <div class="flex items-center justify-between">
          <span class="text-sm">Pages</span>
          <button id="addPage" class="rounded bg-sky-600 hover:bg-sky-500 px-2 py-1 text-xs">+ Add page</button>
        </div>
        <div id="pageTabs" class="flex flex-wrap gap-1"></div>
        <select id="movePage" class="w-full rounded bg-slate-700 px-2 py-1 text-sm disabled:opacity-40"></select>
        <button id="deletePage" class="w-full rounded bg-slate-700 hover:bg-red-700 disabled:opacity-40 disabled:hover:bg-slate-700 px-3 py-1.5 text-xs transition">Delete this page</button>
      </div>

      <div class="space-y-2 border-t border-slate-700 pt-3">
        <label class="block text-sm">Page size
          <select id="pageSize" class="mt-1 w-full rounded bg-slate-700 px-2 py-1.5 text-sm"></select>
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input id="landscape" type="checkbox" class="accent-sky-500">
          Landscape
        </label>
        <label class="block text-sm">Margin: <span id="marginVal">0.25</span> in
          <input id="margin" type="range" min="0" max="100" value="25" class="w-full">
        </label>
      </div>

      <label class="block text-sm">Crop tolerance: <span id="cropVal">6</span>%
        <input id="crop" type="range" min="0" max="20" value="6" class="w-full">
      </label>

      <label class="block text-sm">Gutter: <span id="gutVal">0.08</span> in
        <input id="gutter" type="range" min="0" max="50" value="8" class="w-full">
      </label>

      <label class="block text-sm">Min photo size: <span id="minVal">1.5</span> in
        <input id="minsize" type="range" min="5" max="40" value="15" class="w-full">
      </label>

      <label class="block text-sm">Max photo size: <span id="maxVal">11.0</span> in
        <input id="maxsize" type="range" min="20" max="110" value="110" class="w-full">
      </label>

      <label class="block text-sm">Photos per row: <span id="perRowVal">any</span>
        <span class="flex gap-2 mt-1">
          <input id="minPerRow" type="number" min="1" max="8" value="1"
                 class="w-full rounded bg-slate-700 px-2 py-1 text-sm" aria-label="Minimum per row">
          <input id="maxPerRow" type="number" min="0" max="8" value="0"
                 class="w-full rounded bg-slate-700 px-2 py-1 text-sm" aria-label="Maximum per row">
        </span>
      </label>

      <label class="block text-sm">Density vs evenness: <span id="ratioVal">3.0</span>&times;
        <input id="ratio" type="range" min="10" max="50" value="30" class="w-full">
      </label>

      <label class="flex items-center gap-2 text-sm">
        <input id="manual" type="checkbox" class="accent-sky-500">
        Manual sizing
      </label>

      <div id="warnings" class="text-xs text-amber-300 space-y-1"></div>

      <div class="space-y-2 pt-2">
        <button id="pdf" class="w-full rounded bg-slate-600 hover:bg-slate-500 px-3 py-2 text-sm">Export PDF</button>
        <button id="png" class="w-full rounded bg-slate-600 hover:bg-slate-500 px-3 py-2 text-sm">Export PNG</button>
        <button id="print" class="w-full rounded bg-slate-600 hover:bg-slate-500 px-3 py-2 text-sm">Print</button>
      </div>

      <p id="count" class="text-xs text-slate-400"></p>

      <div class="space-y-2 pt-2 border-t border-slate-700">
        <p class="text-xs text-slate-400 pt-1">Recover a past version</p>
        <select id="versionList" class="w-full rounded bg-slate-700 px-2 py-1 text-sm"></select>
        <button id="restore" class="w-full rounded bg-slate-600 hover:bg-slate-500 disabled:opacity-40 disabled:hover:bg-slate-600 px-3 py-2 text-sm transition">Restore version</button>
        <p class="text-xs text-slate-500">Saved automatically as you work, and when you close the tab.</p>

        <input id="projName" placeholder="Sheet name" class="w-full rounded bg-slate-700 px-2 py-1 text-sm mt-2">
        <button id="save" class="w-full rounded bg-slate-600 hover:bg-slate-500 px-3 py-2 text-sm">Save sheet</button>
        <select id="projList" class="w-full rounded bg-slate-700 px-2 py-1 text-sm"></select>
        <button id="load" class="w-full rounded bg-slate-600 hover:bg-slate-500 px-3 py-2 text-sm">Open sheet</button>
      </div>
    </aside>

    <main class="relative flex-1 overflow-auto">
      <!-- Wrapper centres the sheet while it fits and lets it overflow in both
           axes when zoomed. place-items-center alone clips the top-left of an
           oversized child, putting part of the page permanently out of reach. -->
      <div class="min-w-full min-h-full w-fit grid place-items-center p-6">
        <div id="sheet" class="relative bg-white shadow-2xl"></div>
      </div>

      <div class="sticky bottom-4 left-0 ml-4 mr-auto w-fit flex items-center gap-1 rounded-full bg-slate-800/90 backdrop-blur px-2 py-1 shadow-lg">
        <button id="zoomOut" title="Zoom out (Ctrl+-)"
          class="w-7 h-7 rounded-full hover:bg-slate-700 disabled:opacity-40 text-sm">−</button>
        <button id="zoomFit" title="Fit to window"
          class="px-2 h-7 rounded-full hover:bg-slate-700 text-xs tabular-nums min-w-[4rem]">Fit</button>
        <button id="zoomIn" title="Zoom in (Ctrl+=)"
          class="w-7 h-7 rounded-full hover:bg-slate-700 disabled:opacity-40 text-sm">+</button>
      </div>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
